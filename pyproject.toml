[project]
name = "product-shots"
version = "0.1.0"
description = "Product ads where Blender owns the product and an image model paints only the room around it"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pillow>=10.0",
  "openai>=1.60",
  "google-genai>=1.0",
]

[project.optional-dependencies]
overlay = ["playwright>=1.45"]
dev = ["pytest>=8"]

[project.scripts]
shots = "shots.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shots*"]

[tool.setuptools.package-data]
shots = ["bpy/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
